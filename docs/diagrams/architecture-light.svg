  <rect x="596" y="228" width="230" height="82" rx="9" fill="#f1f4f0" stroke="#dde3dd"/>
  <text x="610" y="251" class="sans" font-size="13.5" font-weight="700" fill="#16241d">Native Report Writers</text>
  <text x="610" y="270" class="sans" font-size="11.2" fill="#55665d">Pure-Rust .xlsx · .pdf · .docx</text>
  <text x="610" y="288" class="mono" font-size="9.8" fill="#7d8e85">Provenance + educational notice</text>

  <rect x="354" y="322" width="472" height="24" rx="6" fill="#e4f0ea"/>
  <text x="590" y="338" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#194b39">Stdin-piped OS curl · Proto-locked HTTPS · Zero telemetry · No brokerage</text>

  <!-- Arrows Center -> Right -->
  <line x1="846" y1="152" x2="890" y2="152" stroke="#246b51" stroke-width="1.6" marker-end="url(#a2)" marker-start="url(#a2)"/>
  <line x1="846" y1="236" x2="890" y2="236" stroke="#246b51" stroke-width="1.6" marker-end="url(#a2)" marker-start="url(#a2)"/>
