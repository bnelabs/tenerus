  <text x="910" y="178" class="mono" font-size="9.8" fill="#7d8e85">Atomic writes · 0700 / 0600 Unix</text>

  <rect x="894" y="200" width="272" height="72" rx="10" fill="#ffffff" stroke="#dde3dd" stroke-width="1.2"/>
