  <text x="338" y="102" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#7d8e85">TENERUS DESKTOP BINARY (RUST + EGUI)</text>
  <text x="894" y="102" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#7d8e85">PRIVATE LOCAL STORAGE</text>

