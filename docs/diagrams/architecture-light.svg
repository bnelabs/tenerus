  <rect x="894" y="284" width="272" height="76" rx="10" fill="#ffffff" stroke="#dde3dd" stroke-width="1.2"/>
  <text x="910" y="312" class="sans" font-size="13" font-weight="700" fill="#16241d">Secret Isolation</text>
